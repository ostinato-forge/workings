name: CI

on:
  # Long-lived branches run on push. Every other branch runs once, through its pull request.
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older pull request run. Every push to a long-lived branch gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Type check, unit tests, both browser sweeps, then the production build check.
      - run: npm run gate
        env:
          WORKINGS_SCREENSHOT_DIR: sweep-screenshots
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-screenshots
          path: sweep-screenshots
          if-no-files-found: ignore
          retention-days: 7
